# Builds docs/ into a static site with GitSpec and publishes it to GitHub Pages.
# Needs no secret; enable Pages once (Settings → Pages → Source: GitHub Actions).
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "gitspec.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GitSpec dates each page from its commit history
      - uses: PasserBo/GitSpec@main
        with:
          output: _site
          base: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
