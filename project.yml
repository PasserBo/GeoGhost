name: GeoGhost
options:
  bundleIdPrefix: com.passerbo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: J95TRWHWYM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  GeoGhost:
    type: application
    platform: iOS
    sources:
      - path: GeoGhost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passerbo.geoghost
        PRODUCT_NAME: GeoGhost
        INFOPLIST_KEY_CFBundleDisplayName: GeoGhost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "GeoGhost uses the camera to capture stickers, graffiti and murals you find on the street."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GeoGhost records where you found each piece so it can appear on your map."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "GeoGhost saves exported stickers to your photo library."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    entitlements:
      path: GeoGhost/GeoGhost.entitlements
      properties: {}
  GeoGhostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GeoGhostTests
    dependencies:
      - target: GeoGhost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passerbo.geoghost.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GeoGhost:
    build:
      targets:
        GeoGhost: all
        GeoGhostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [GeoGhostTests]
    archive:
      config: Release
