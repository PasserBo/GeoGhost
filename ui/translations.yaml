        unavailable: カメラを使用できない
        permission_denied: カメラへのアクセスが拒否されている
    segmentation_editor:
      title: 切り抜き編集
      states:
        nothing_selected: まだ何も選択していない
        selected: 選択済み
    manual_crop:
      title: 手動切り抜き
      states:
        typical: 切り抜き枠をドラッグ
    save_artwork:
      title: 作品を保存
      states:
        typical: 種類とメモを入力
    share_card:
      title: シェアカード
      states:
        field_note: フィールドノート
        polaroid: ポラロイド
        poster: ポスター
        minimal: ミニマル
        tall_sticker: フィールドノート、縦長のステッカー
        wide_sticker: フィールドノート、横長のステッカー
    series_share_card:
