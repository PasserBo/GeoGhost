# 图库的英语和日语文案。screen.yaml 和 event.yaml 里的中文是原文，这里是对应的翻译；
# 只影响图库页面上的说明文字，截图本身不变。
#
# 在 screen.yaml 或 event.yaml 里加了屏幕、状态、事件或原因，要在这里补上两种语言
# （测试会检查有没有漏）。用词跟 app 自己的英语、日语界面保持一致：
# piece / 作品，Collection / 図鑑，world map / ワールドマップ。
#
# 结构：
#   screens.<屏幕>.title / states.<状态>   屏幕名和状态名
#   events.<事件>                           事件说明
#   reasons.<中文原文>                      「没有图」和「比对时跳过」的原因，按原文查找
en:
  screens:
    collection:
      title: Collection
      states:
        empty: Nothing collected yet
        typical: With pieces
        filtered_empty: Filters match nothing
        search_no_results: Search finds nothing
    artwork_detail:
      title: Piece detail
      states:
        no_location: Piece without a location
        with_location: Piece with a location
    edit_artwork:
      title: Edit piece
      states:
        in_series: Belongs to a series
    series_list:
      title: Series
      states:
        empty: No series yet
        typical: With series
    series_detail:
      title: Series detail
      states:
        no_location: No member has a location
        with_route: With a route map
    map:
      title: Map
      states:
        mine: My pieces
        world: World map
        empty: Nothing collected yet
    world_strip:
      title: Strip under the world map
      states:
        latest: Latest finds
        group: The pieces behind one pin
        many: Many pieces behind one pin
        loading: Loading
    world_post_grid:
      title: Everything behind one pin or in one area
      states:
        typical: 23 pieces
        loading: The rest still loading
        capped: More than can be fetched
    world_empty_area:
      title: Empty area of the world map
      states:
        invitation: "Invitation: own pieces around here"
        in_review: Own pieces in review
        nothing_of_mine: No pieces of one's own here
    world_top_notice:
      title: Notice at the top of the world map
      states:
        pointer: Pointer to one's own area
        error: Loading failed
    remote_post:
      title: Someone else's piece
      states:
        typical: Viewing a published piece
    capture:
      title: Capture
      states:
        camera: Viewfinder
        unavailable: Camera unavailable
        permission_denied: Camera access denied
    segmentation_editor:
      title: Cutout editor
      states:
        nothing_selected: Nothing selected yet
        selected: With a selection
    manual_crop:
      title: Manual crop
      states:
        typical: Dragging the crop frame
    save_artwork:
      title: Save piece
      states:
        typical: Choosing a type and adding a note
    share_card:
      title: Share card
      states:
        field_note: Field note
        polaroid: Polaroid
        poster: Poster
        minimal: Minimal
        tall_sticker: Field note, tall sticker
        wide_sticker: Field note, wide sticker
    series_share_card:
      title: Series share card
      states:
        distance: Distance card (stand-in map)
        encounters: Encounters card (stand-in map)
        no_location: No member has a location
        same_city: Same city, with the country locator
        tall_sticker: Tall sticker
        wide_sticker: Wide sticker
    publish_status:
      title: Publish status card
      states:
        unpublished: Not published
        uploading: Upload not finished
        pending: In review
        published: Published
        re_review: Back in review
        rejected: Did not pass review
    publish:
      title: Publish to the world map
      states:
        ready: Ready to publish
        quota_reached: Today's limit reached
    profile_setup:
      title: Nickname and community rules
      states:
        first_time: Before the first post
    report:
      title: Report a piece
      states:
        form: Choosing a reason
        sent: Submitted
    blocked_users:
      title: Blocked users
      states:
        typical: With blocked users
        empty: Nobody blocked
    settings:
      title: Settings
      states:
        typical: Default
    feedback:
      title: Send feedback
      states:
        empty: Empty form
        sent: Sent
    paywall:
      title: GeoGhost Pro
      states:
        locked: Not purchased (in-app purchase is not open yet, so users can't see this screen)
  events:
    screen_view: A screen is shown
    capture_started: Capture opened
    artwork_saved: A piece is saved
    artwork_edited: A piece's type, note or tags are changed
    artwork_deleted: A piece is deleted
    collection_filtered: The collection is filtered or sorted
    series_opened: A series is opened
    share_card_exported: A share card is exported
    world_map_opened: The world map is opened
    world_post_opened: A piece is opened from the world map
    world_invitation_started: Publishing starts from a world map prompt
    publish_started: Publish is tapped
    publish_finished: Publishing ends
    publish_retracted: A published piece is retracted
    profile_saved: Nickname saved and community rules agreed to
    map_mode_changed: The map mode is switched
    remote_post_opened: Someone else's piece is opened
    post_reported: A piece is reported
    user_blocked: A user is blocked
    feedback_sent: Feedback is sent
  reasons:
    系统搜索栏的占位文字时粗时细，无法从外部固定: The system search bar draws its placeholder text in one of two weights, and that can't be fixed from outside
    地图由系统绘制，瓦片从网络加载，每次不一定相同: The map is drawn by the system and its tiles are loaded over the network, so it isn't the same every time
    整屏都是地图：地图由系统绘制，瓦片从网络加载，每次不一定相同。这个屏幕只进图库，不参与比对: "The whole screen is a map: it is drawn by the system and its tiles are loaded over the network, so it isn't the same every time. This screen is shown in the gallery but not compared"
    模拟器没有相机，取景画面只能在真机上看到: The simulator has no camera; the viewfinder can only be seen on a real iPhone
    要先在系统里拒绝相机权限，测试运行中改不了: Camera access has to be denied in the system first, which a test run can't do
    「附带信息」里有构建号，每次提交都会变: The "Sent with" row contains the build number, which changes with every commit

ja:
  screens:
    collection:
      title: 図鑑
