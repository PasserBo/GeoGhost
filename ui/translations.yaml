      title: GeoGhost Pro
      states:
        locked: 未購入（アプリ内課金は未公開のため、ユーザーにはまだ表示されない画面）
  events:
    screen_view: 画面が表示された
    capture_started: 撮影を開いた
    artwork_saved: 作品を保存した
    artwork_edited: 作品の種類・メモ・タグを変更した
    artwork_deleted: 作品を削除した
    collection_filtered: 図鑑を絞り込み・並べ替えした
    series_opened: シリーズを開いた
    share_card_exported: シェアカードを書き出した
    world_map_opened: ワールドマップを開いた
    world_post_opened: ワールドマップから作品を開いた
    world_invitation_started: ワールドマップの案内から公開を始めた
    publish_started: 公開をタップした
    publish_finished: 公開処理が終わった
    publish_retracted: 公開した作品を取り下げた
    profile_saved: ニックネームを保存し、コミュニティルールに同意した
    map_mode_changed: マップのモードを切り替えた
    remote_post_opened: 他の人の作品を開いた
    post_reported: 作品を報告した
    user_blocked: ユーザーをブロックした
    feedback_sent: フィードバックを送信した
  reasons:
    系统搜索栏的占位文字时粗时细，无法从外部固定: システムの検索バーはプレースホルダーの文字を 2 種類の太さのどちらかで描画し、外部から固定できない
    地图由系统绘制，瓦片从网络加载，每次不一定相同: マップはシステムが描画し、タイルをネットワークから読み込むため、毎回同じになるとは限らない
    整屏都是地图：地图由系统绘制，瓦片从网络加载，每次不一定相同。这个屏幕只进图库，不参与比对: 画面全体がマップ。マップはシステムが描画し、タイルをネットワークから読み込むため、毎回同じになるとは限らない。この画面はギャラリーには載せるが、比較の対象にはしない
    模拟器没有相机，取景画面只能在真机上看到: シミュレータにはカメラがなく、ファインダーは実機でしか見られない
    要先在系统里拒绝相机权限，测试运行中改不了: 先にシステム側でカメラへのアクセスを拒否する必要があり、テスト実行中には変更できない
    「附带信息」里有构建号，每次提交都会变: 「送信される情報」にビルド番号が含まれ、コミットのたびに変わる
