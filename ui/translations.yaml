    artwork_detail:
      title: 作品の詳細
      states:
        no_location: 位置情報のない作品
        with_location: 位置情報のある作品
    edit_artwork:
      title: 作品を編集
      states:
        in_series: シリーズに属している
    series_list:
      title: シリーズ
      states:
