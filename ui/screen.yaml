# 屏幕清单：GeoGhost 里每一个屏幕、弹层和关键组件，以及它们各自的状态。
#
# 这份文件同时是三件事的依据：
#   1. 数据分析 —— event.yaml 里的事件只能引用这里的屏幕和状态。
#   2. 快照测试 —— GeoGhostTests/UISnapshots 按这里的组合渲染基准图，存到 ui/snapshots/。
#   3. 网页图库 —— scripts/build-ui-gallery.rb 按这里的结构生成给设计师看的页面。
#
# 状态的划分标准：用户看到的内容有实质区别，而且分析时值得单独统计。
# 改了这里，要同步改 GeoGhostTests/UISnapshots/ScreenCatalog.swift（测试会检查两边是否一致）。
#
# 字段：
#   title      给人看的名字
#   kind       screen（整屏）| sheet（弹层）| component（屏幕里的一块）
#   spec       对应的行为规格（docs/spec 里的能力名），没有就不写
#   default    代表这个屏幕的状态；非主语言只截这一个
#   unstable   比对时跳过的区域（单位是点，原点在左上角），必须写 reason。
#              只用于系统自己画、每次不一定相同的部分；图库里的图不受影响。
#   states     状态名 → { title, fixture, snapshot, reason }
#     fixture    用哪一份固定数据（GeoGhostTests/UISnapshots/UIFixtures.swift）
#     snapshot   false 表示暂时不截图，必须写 reason
version: 1

matrix:
  # 基准图只在这台模拟器上录制和比对；换 Xcode 大版本后要整体重录。
  # scale 是保存图片的倍率：2 倍足够看清细节，体积不到 3 倍的一半。
  device: { name: iPhone 17 Pro, width: 402, height: 874, scale: 2 }
  # 主语言截全部状态 × 全部外观；其余语言只截 default 状态的浅色。
  primary_locale: zh-Hans
  locales: [zh-Hans, en, ja]
  # 每种语言录制时用的地区（决定日期和数字的写法）。
  regions: { zh-Hans: CN, en: US, ja: JP }
  appearances: [light, dark]

screens:
  collection:
    title: 收藏
    kind: screen
    default: typical
    unstable:
      - { x: 28, y: 796, width: 346, height: 52, reason: 系统搜索栏的占位文字时粗时细，无法从外部固定 }
    states:
      empty: { title: 还没有任何收藏, fixture: empty }
      typical: { title: 有收藏, fixture: typical }
      filtered_empty: { title: 筛选后没有结果, fixture: typical }
      search_no_results: { title: 搜索没有结果, fixture: typical }

  artwork_detail:
    title: 贴纸详情
    kind: screen
    default: no_location
    unstable:
      - { x: 16, y: 830, width: 370, height: 44, reason: 地图由系统绘制，瓦片从网络加载，每次不一定相同 }
    states:
      no_location: { title: 没有位置的贴纸, fixture: typical }
      with_location: { title: 有位置的贴纸, fixture: typical }

  edit_artwork:
    title: 编辑贴纸
    kind: sheet
    default: in_series
    states:
      in_series: { title: 属于某个系列, fixture: typical }

  series_list:
    title: 系列
    kind: screen
    default: typical
    states:
      empty: { title: 还没有系列, fixture: empty }
      typical: { title: 有系列, fixture: typical }

  series_detail:
    title: 系列详情
    kind: screen
    default: no_location
    unstable:
      - { x: 16, y: 160, width: 370, height: 275, reason: 地图由系统绘制，瓦片从网络加载，每次不一定相同 }
    states:
      no_location: { title: 成员都没有位置, fixture: typical }
      with_route: { title: 有路线地图, fixture: typical }

  map:
    title: 地图
    kind: screen
    spec: explore-map
    default: mine
    unstable:
      - { x: 0, y: 0, width: 402, height: 874, reason: 整屏都是地图：地图由系统绘制，瓦片从网络加载，每次不一定相同。这个屏幕只进图库，不参与比对 }
    states:
      mine: { title: 我的贴纸, fixture: typical }
      world: { title: 世界地图, fixture: typical }
      empty: { title: 还没有任何贴纸, fixture: empty }

  world_strip:
    title: 世界地图下方的卡片条
    kind: component
    spec: explore-map
    default: latest
    states:
      latest: { title: 最新发现, fixture: typical }
      group: { title: 一个图钉里的作品, fixture: typical }
      loading: { title: 加载中, fixture: typical }

  world_empty_area:
    title: 世界地图的空白区域
    kind: component
    spec: explore-map
    default: invitation
    states:
      invitation: { title: 邀请：这一带有自己的收藏, fixture: typical }
      in_review: { title: 自己的收藏正在审核, fixture: typical }
      nothing_of_mine: { title: 这一带没有自己的收藏, fixture: typical }

  world_top_notice:
    title: 世界地图顶部的提示
    kind: component
    spec: explore-map
    default: pointer
    states:
      pointer: { title: 指向自己的区域, fixture: typical }
      error: { title: 加载失败, fixture: typical }

  remote_post:
    title: 他人的贴纸
    kind: sheet
    spec: explore-map
    default: typical
    states:
      typical: { title: 查看他人发布的贴纸, fixture: empty }

  capture:
    title: 拍摄
    kind: screen
    default: unavailable
    states:
      camera: { title: 取景, snapshot: false, reason: 模拟器没有相机，取景画面只能在真机上看到 }
      unavailable: { title: 相机不可用, fixture: empty }
      permission_denied: { title: 没有相机权限, snapshot: false, reason: 要先在系统里拒绝相机权限，测试运行中改不了 }

  segmentation_editor:
    title: 抠图编辑
    kind: screen
    default: nothing_selected
    states:
      nothing_selected: { title: 还没有选中任何部分, fixture: empty }
      selected: { title: 已选中, fixture: empty }

  manual_crop:
    title: 手动裁剪
    kind: screen
    default: typical
    states:
      typical: { title: 拖动裁剪框, fixture: empty }

  save_artwork:
    title: 保存贴纸
    kind: sheet
    default: typical
    states:
      typical: { title: 填写类型和备注, fixture: empty }

  share_card:
    title: 分享卡片
    kind: component
    default: field_note
    states:
      field_note: { title: 田野笔记, fixture: typical }
      polaroid: { title: 拍立得, fixture: typical }
      poster: { title: 海报, fixture: typical }
      minimal: { title: 极简, fixture: typical }
      tall_sticker: { title: 田野笔记，竖长的贴纸, fixture: typical }
      wide_sticker: { title: 田野笔记，扁宽的贴纸, fixture: typical }

  series_share_card:
    title: 系列分享卡片
    kind: component
    spec: share-card
    default: distance
    states:
      distance: { title: 距离卡（地图为占位底图）, fixture: typical }
      encounters: { title: 次数卡（地图为占位底图）, fixture: typical }
      no_location: { title: 成员都没有位置, fixture: typical }
      same_city: { title: 同城，带定位小图, fixture: typical }
      tall_sticker: { title: 竖长的贴纸, fixture: typical }
      wide_sticker: { title: 扁宽的贴纸, fixture: typical }

  publish_status:
    title: 发布状态卡片
    kind: component
    spec: publishing
    default: unpublished
    states:
      unpublished: { title: 未发布, fixture: typical }
      uploading: { title: 上传未完成, fixture: typical }
      pending: { title: 审核中, fixture: typical }
      published: { title: 已发布, fixture: typical }
      re_review: { title: 复审中, fixture: typical }
      rejected: { title: 未通过审核, fixture: typical }

  publish:
    title: 发布到世界地图
    kind: sheet
    spec: publishing
    default: ready
    unstable:
      - { x: 16, y: 520, width: 370, height: 220, reason: 地图由系统绘制，瓦片从网络加载，每次不一定相同 }
    states:
      ready: { title: 可以发布, fixture: typical }
      quota_reached: { title: 今天的额度用完, fixture: typical }

  profile_setup:
    title: 昵称与社区规则
    kind: sheet
    spec: online-identity
    default: first_time
    states:
      first_time: { title: 第一次发布前, fixture: empty }

  report:
    title: 举报贴纸
    kind: sheet
    spec: content-safety
    default: form
    states:
      form: { title: 选择原因, fixture: empty }
      sent: { title: 已提交, fixture: empty }

  blocked_users:
    title: 已屏蔽的用户
    kind: screen
    spec: content-safety
    default: typical
    states:
      typical: { title: 有屏蔽的用户, fixture: empty }
      empty: { title: 没有屏蔽任何人, fixture: empty }

  settings:
    title: 设置
    kind: screen
    default: typical
    states:
      typical: { title: 默认, fixture: typical }

  feedback:
    title: 发送反馈
    kind: sheet
    default: empty
    unstable:
      - { x: 16, y: 560, width: 370, height: 120, reason: 「附带信息」里有构建号，每次提交都会变 }
    states:
      empty: { title: 空白表单, fixture: empty }
      sent: { title: 已发送, fixture: empty }

  paywall:
    title: GeoGhost Pro
    kind: sheet
    default: locked
    states:
      locked: { title: 未购买（内购尚未开放，用户目前看不到这个界面）, fixture: empty }
